# Local dev dependency: Postgres only. The API and web run on the host via
# `make dev`. This mirrors prod shape (Cloud SQL Postgres) without extra weight.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mockinterview-pg
    environment:
      POSTGRES_USER: mockinterview
      POSTGRES_PASSWORD: mockinterview
      POSTGRES_DB: mockinterview
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mockinterview_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mockinterview"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app]
    build: ./api
    env_file: .env
    environment:
      APP_ENV: development
      LOCAL_UNLIMITED: "true"
      PORT: "8080"
      DATABASE_URL: postgres://mockinterview:mockinterview@postgres:5432/mockinterview?sslmode=disable
      CORS_ALLOW: http://localhost:3000
      PUBLIC_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: local/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mockinterview_pg:
