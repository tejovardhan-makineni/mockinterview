name: Security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 15 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-vulnerabilities:
    name: Go vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Check reachable Go vulnerabilities
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  dependencies:
    name: Dependencies (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, desktop, mobile]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci --prefix "$APP" --no-audit --no-fund
        env:
          APP: ${{ matrix.app }}
      - name: Test audit policy
        run: node --test scripts/security-audit.test.mjs web/scripts/security-audit.test.mjs
      - name: Audit locked dependency tree
        run: node scripts/security-audit.mjs "$APP" --report-dir audit-results
        env:
          APP: ${{ matrix.app }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: audit-${{ matrix.app }}
          path: audit-results
          if-no-files-found: ignore
  audit-gate:
    name: Dependency audit
    if: always()
    needs: [dependencies, go-vulnerabilities]
    runs-on: ubuntu-latest
    steps:
      - name: All dependency audits must pass
        env:
          AUDITS: ${{ needs.dependencies.result }}
          GO_AUDIT: ${{ needs.go-vulnerabilities.result }}
        run: test "$AUDITS" = success && test "$GO_AUDIT" = success
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan history with verified Gitleaks release
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts=--all .
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.language == 'go'
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Go for analysis
        if: matrix.language == 'go'
        working-directory: api
        run: go build ./...
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
