name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: mockinterview
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: mockinterview_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mockinterview -d mockinterview_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mockinterview:local-ci-only@localhost:5432/mockinterview_ci?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l internal cmd)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Validate corpus and scaffold fixtures
        run: |
          go run ./cmd/mockinterview -validate-corpus data/corpus
          python3 ../scripts/test_content.py
          python3 ../scripts/test_deploy.py
      # Real database tests use isolated schemas; providers remain stubbed.

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Third-party notice packaging
        run: node --test scripts/generate-notices.test.mjs
      - name: Build production export (no running backend needed)
        run: npm run build
        env:
          APP_ENV: production
          NEXT_PUBLIC_MOCK: "0"
          NEXT_PUBLIC_API_BASE: https://mockinterview-api-661893776515.us-west1.run.app
