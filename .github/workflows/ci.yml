name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l internal cmd)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      # The corpus validator and every handler test run against the in-memory
      # store and the LLM stub, so no Postgres or API key is needed in CI.

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `npm install` (not `npm ci`) tolerates minor lock drift from transitive
      # optional deps (sass/@parcel-watcher) that vary by platform/npm version.
      - run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (mock mode — no backend needed)
        run: npm run build
        env:
          NEXT_PUBLIC_MOCK: "1"
